<main class="bible-app">
  <div class="container">
    <header>
      <h1>Bible Study Application</h1>
      <p>Compare translations and explore original language texts</p>
    </header>

    <!-- Selector Section -->
    <app-selector (selectionChanged)="onSelectionChanged($event)"></app-selector>

    <!-- Three Column Layout -->
    <div class="three-column-layout">
      <div class="column left-column">
        <app-translation-panel #leftPanel title="Left Translation" position="left"></app-translation-panel>
      </div>

      <div class="column middle-column">
        <app-original-language-panel #originalPanel></app-original-language-panel>
      </div>

      <div class="column right-column">
        <app-translation-panel #rightPanel title="Right Translation" position="right"></app-translation-panel>
      </div>
    </div>
  </div>
</main>

<style>
  :host {
    --primary-color: #0066cc;
    --secondary-color: #6f42c1;
    --text-color: #333;
    --light-bg: #f8f9fa;
    --border-color: #e0e0e0;

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
      sans-serif;
    display: block;
    width: 100%;
    height: 100%;
  }

  main.bible-app {
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
    padding: 20px;
    box-sizing: border-box;
  }

  .container {
    max-width: 1600px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 40px;

    h1 {
      margin: 0 0 10px 0;
      font-size: 2.5rem;
      color: var(--text-color);
      font-weight: 600;
    }

    p {
      margin: 0;
      color: #666;
      font-size: 1rem;
    }
  }

  .three-column-layout {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    min-height: 600px;

    @media (max-width: 1200px) {
      grid-template-columns: 1fr 1fr;
      gap: 15px;

      .right-column {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      grid-template-columns: 1fr;
      gap: 15px;
      min-height: auto;
    }
  }

  .column {
    min-height: 600px;

    @media (max-width: 768px) {
      min-height: 400px;
    }
  }
</style>
