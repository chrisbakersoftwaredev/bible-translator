<div class="selector-container">
  <h2>Bible Verse Selector</h2>
  <form [formGroup]="form" class="selector-form">
    <div class="form-group">
      <label for="book">Book</label>
      <select id="book" formControlName="book" class="form-control">
        <option value="">Select a Book</option>
        @for (book of books(); track book) {
          <option [value]="book">{{ book }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="chapter">Chapter</label>
      <select id="chapter" formControlName="chapter" class="form-control">
        <option value="">Select a Chapter</option>
        @for (chapter of chapters(); track chapter) {
          <option [value]="chapter">{{ chapter }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="verse">Verse</label>
      <select id="verse" formControlName="verse" class="form-control">
        <option value="">Select a Verse</option>
        @for (verse of verses(); track verse) {
          <option [value]="verse">{{ verse }}</option>
        }
      </select>
    </div>
  </form>

  <div class="selected-reference">
    <span>{{ selectedReference() }}</span>
  </div>
</div>
